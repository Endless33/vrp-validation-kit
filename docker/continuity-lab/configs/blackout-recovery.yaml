schema_version: "vrp-continuity-lab/scenario-v1"

scenario:
  id: "blackout-recovery"
  title: "Bounded Dual-Path Blackout and Recovery"
  category: "recovery"
  description: >-
    Evaluate externally observable recovery behavior after both logical
    paths become unavailable for a bounded interval and only the alternate
    path is subsequently restored.
  public_claim: >-
    A bounded loss of all available paths does not automatically require
    replacement of the public continuity reference when connectivity later
    returns within the declared evaluation window.

execution:
  duration_seconds: 70
  infrastructure_ready_timeout_seconds: 30
  subject_ready_timeout_seconds: 20
  completion_grace_seconds: 15
  timeline_origin: "subject-ready"
  clock_source: "host-monotonic"

topology:
  profile: "dual-path-single-origin-v1"
  logical_paths:
    - id: "wifi"
      role: "primary"
      initial_state: "enabled"
    - id: "mobile"
      role: "alternate"
      initial_state: "enabled"
  control_plane_visible_to_subject: false
  scenario_schedule_visible_to_subject: false
  host_ports_published: false

preconditions:
  - id: "origin-reachable"
    check: "origin.reachable"
    target: "origin"
    required: true

  - id: "wifi-path-reachable"
    check: "path.reachable"
    target: "wifi"
    required: true

  - id: "mobile-path-reachable"
    check: "path.reachable"
    target: "mobile"
    required: true

  - id: "subject-ready"
    check: "subject.health"
    target: "subject"
    required: true

fault_schedule:
  - event_id: "all-paths-disable-001"
    at_seconds: 15
    action: "paths.disable"
    targets:
      - "wifi"
      - "mobile"
    witness_required: true
    description: >-
      Disable both logical paths while keeping the controlled origin
      available behind the isolated fault boundary.

  - event_id: "mobile-enable-001"
    at_seconds: 30
    action: "path.enable"
    target: "mobile"
    witness_required: true
    description: >-
      Restore only the alternate logical path after the bounded blackout.

observation_windows:
  baseline:
    begins_at: "subject-ready"
    ends_at: "all-paths-disable-001"
    minimum_successful_progress_events: 5

  blackout:
    begins_at: "all-paths-disable-001"
    ends_at: "mobile-enable-001"
    expected_duration_seconds: 15
    settling_grace_seconds: 2
    maximum_successful_progress_events_after_grace: 0

  recovery:
    begins_at: "mobile-enable-001"
    maximum_recovery_seconds: 15

  post_recovery:
    begins_after: "mobile-enable-001"
    ends_at: "run-complete"
    minimum_successful_progress_events: 5
    expected_active_path: "mobile"

acceptance:
  contract: "../../expected/invariant-contract.json"

  required_invariants:
    - "VRP-LAB-EVIDENCE-COMPLETE"
    - "VRP-LAB-RUN-ID-CONSISTENT"
    - "VRP-LAB-EVENT-SEQUENCE-MONOTONIC"
    - "VRP-LAB-EVENT-ID-UNIQUE"
    - "VRP-LAB-CONTINUITY-REFERENCE-STABLE"
    - "VRP-LAB-BLACKOUT-OBSERVED"
    - "VRP-LAB-RECOVERY-OBSERVED"
    - "VRP-LAB-PROGRESS-RESUMED"
    - "VRP-LAB-NO-DUPLICATE-ACCEPTANCE"

  parameters:
    expected_blackout_seconds: 15
    blackout_tolerance_seconds: 2
    maximum_recovery_seconds: 15
    expected_final_active_path: "mobile"
    minimum_baseline_progress_events: 5
    minimum_post_recovery_progress_events: 5
    maximum_continuity_reference_count: 1
    maximum_duplicate_accepted_mutations: 0

evidence:
  format: "public-evidence-v1"

  required_subject_artifacts:
    - "subject-evidence.json"
    - "subject-events.jsonl"

  required_witness_events:
    - "infrastructure.ready"
    - "subject.ready"
    - "path.wifi.disabled"
    - "path.mobile.disabled"
    - "blackout.started"
    - "path.mobile.enabled"
    - "blackout.ended"
    - "subject.completed"
    - "run.completed"

  prohibited_content:
    raw_protected_packets: true
    cryptographic_keys: true
    credentials: true
    protected_tokens: true
    internal_runtime_state: true
    proprietary_recovery_logic: true
    proprietary_decision_traces: true
    source_code_paths: true

verdict_policy:
  fail_closed: true
  missing_required_evidence: "INCOMPLETE"
  infrastructure_failure: "INCOMPLETE"
  unexpected_harness_error: "INCOMPLETE"
  contradicted_invariant: "FAIL"
  subject_failure_with_healthy_infrastructure: "FAIL"
  all_required_invariants_satisfied: "PASS"

limitations:
  - >-
    The blackout is created at the Docker proxy boundary and does not
    reproduce every physical-network failure mode.
  - >-
    The origin remains available so that path loss can be distinguished
    from origin failure.
  - >-
    This scenario evaluates only the declared public observations for one
    bounded run.
  - >-
    A PASS result does not expose or independently prove the protected
    recovery implementation used by the subject.